name: Publish PowerShell Module

on:
  workflow_dispatch: {}
  push:
    branches:
      - '**' # Trigger on all branches
    paths:
      - 'AzureFailureSimulator/**'
jobs:
  publish-to-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.2
        with:
          ref: ${{ github.head_ref }}

      - name: Prerequisites
        shell: pwsh
        run: |
          ./build/vsts-prerequisites.ps1

      - name: Build and Publish
        env:
          APIKey: ${{ secrets.APIKey }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: pwsh
        run: |
          $bumpMinor = $env:COMMIT_MESSAGE -match '^feat(\(.+\))?:'
          $params = @{ ApiKey = $env:APIKey; AutoVersion = $true }
          if ($bumpMinor) { $params['BumpMinor'] = $true }
          ./build/vsts-build.ps1 @params